<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhà Địa Chất Tài Ba - Phiếu Học Tập Địa Lí 8</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti for celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #FFFDF5;
            color: #103B5C;
        }
        .custom-shadow {
            box-shadow: 0 10px 25px -5px rgba(16, 59, 92, 0.08), 0 8px 10px -6px rgba(16, 59, 92, 0.08);
        }
        .animate-bounce-short {
            animation: bounce 1s infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 200, 61, 0.6); }
            50% { box-shadow: 0 0 25px rgba(255, 200, 61, 0.9); }
        }
        .glow-effect {
            animation: pulseGlow 2s infinite;
        }
    </style>
</head>
<body class="bg-[#FFFDF5] min-p-0 m-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DATA DEFINITIONS ---
        const PART1_QUESTIONS = [
            { id: 1, text: "Khoáng sản nước ta có cơ cấu khá", correct: "phong phú và đa dạng" },
            { id: 2, text: "Việt Nam đã thăm dò được", correct: "hơn 60" },
            { id: 3, text: "Phần lớn các mỏ khoáng sản có trữ lượng", correct: "trung bình và nhỏ" },
            { id: 4, text: "Khoáng sản tập trung chủ yếu ở", correct: "miền Bắc, miền Trung và Tây Nguyên" }
        ];

        const PART1_KEYWORDS = [
            "phong phú và đa dạng",
            "hơn 60",
            "trung bình và nhỏ",
            "miền Bắc, miền Trung và Tây Nguyên"
        ];

        const PART2_COL_A = [
            { id: 1, name: "Than đá", group: "A" },
            { id: 2, name: "Dầu mỏ", group: "A" },
            { id: 3, name: "Sắt", group: "B" },
            { id: 4, name: "Bô-xít", group: "B" },
            { id: 5, name: "A-pa-tít", group: "C" },
            { id: 6, name: "Đá vôi", group: "C" }
        ];

        const PART2_COL_B = [
            { id: "A", label: "A. Khoáng sản năng lượng" },
            { id: "B", label: "B. Khoáng sản kim loại" },
            { id: "C", label: "C. Khoáng sản phi kim loại" }
        ];

        const PART3_STATEMENTS = [
            { id: 1, text: "Khoáng sản nước ta có cơ cấu phong phú và đa dạng.", correct: true, explanation: "Đúng theo đặc điểm khoáng sản Việt Nam." },
            { id: 2, text: "Phần lớn các mỏ khoáng sản ở Việt Nam có trữ lượng rất lớn.", correct: false, explanation: "Sai. Phần lớn các mỏ có trữ lượng trung bình và nhỏ." },
            { id: 3, text: "Khoáng sản nước ta chỉ phân bố ở khu vực miền Bắc.", correct: false, explanation: "Sai. Khoáng sản phân bố ở nhiều nơi, tập trung chủ yếu ở miền Bắc, miền Trung và Tây Nguyên." },
            { id: 4, text: "Dựa vào quá trình hình thành, có thể chia khoáng sản thành nội sinh và ngoại sinh.", correct: true, explanation: "Đúng theo phân loại nguồn gốc hình thành khoáng sản." }
        ];

        const PART4_QUESTIONS = [
            {
                id: 1,
                question: "Câu 1. Việt Nam đã thăm dò được bao nhiêu loại khoáng sản khác nhau?",
                options: [
                    { key: "A", text: "Hơn 20 loại" },
                    { key: "B", text: "Hơn 40 loại" },
                    { key: "C", text: "Hơn 60 loại" },
                    { key: "D", text: "Hơn 100 loại" }
                ],
                correct: "C",
                explanation: "Việt Nam đã thăm dò được hơn 60 loại khoáng sản khác nhau."
            },
            {
                id: 2,
                question: "Câu 2. Nhóm nào dưới đây gồm toàn khoáng sản kim loại?",
                options: [
                    { key: "A", text: "Than đá, dầu mỏ, khí tự nhiên" },
                    { key: "B", text: "Sắt, đồng, bô-xít" },
                    { key: "C", text: "Đá vôi, a-pa-tít, sét" },
                    { key: "D", text: "Dầu mỏ, sắt, đá vôi" }
                ],
                correct: "B",
                explanation: "Sắt, đồng, bô-xít là nhóm khoáng sản kim loại."
            },
            {
                id: 3,
                question: "Câu 3. Đặc điểm nào gây khó khăn cho việc khai thác và quản lí tài nguyên khoáng sản nước ta?",
                options: [
                    { key: "A", text: "Tất cả mỏ đều có trữ lượng lớn" },
                    { key: "B", text: "Khoáng sản chỉ có ở một vùng" },
                    { key: "C", text: "Phần lớn các mỏ có trữ lượng trung bình và nhỏ" },
                    { key: "D", text: "Chỉ có khoáng sản phi kim loại" }
                ],
                correct: "C",
                explanation: "Phần lớn các mỏ có trữ lượng trung bình và nhỏ, gây khó khăn cho khai thác công nghiệp lớn."
            }
        ];

        // --- MAIN APP COMPONENT ---
        function App() {
            const [studentName, setStudentName] = useState("");
            const [studentClass, setStudentClass] = useState("");
            
            // Part 1 state: mapping question id -> keyword string
            const [part1Answers, setPart1Answers] = useState({});
            
            // Part 2 state: mapping item id from A -> group id ('A', 'B', 'C')
            const [part2Answers, setPart2Answers] = useState({});
            const [selectedAItem, setSelectedAItem] = useState(null);

            // Part 3 state: mapping statement id -> true/false
            const [part3Answers, setPart3Answers] = useState({});

            // Part 4 state: mapping question id -> option key ('A', 'B', 'C', 'D')
            const [part4Answers, setPart4Answers] = useState({});

            // Grading state
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [scoreDetails, setScoreDetails] = useState(null);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [unansweredCount, setUnansweredCount] = useState(0);

            // Re-run lucide icons on render
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Calculate progress count (total 17 items)
            const calculateCompletedCount = () => {
                let count = 0;
                // Part 1: 4 items
                Object.values(part1Answers).forEach(val => { if (val) count++; });
                // Part 2: 6 items
                Object.values(part2Answers).forEach(val => { if (val) count++; });
                // Part 3: 4 items
                Object.values(part3Answers).forEach(val => { if (val !== undefined) count++; });
                // Part 4: 3 items
                Object.values(part4Answers).forEach(val => { if (val) count++; });
                return count;
            };

            const completedCount = calculateCompletedCount();
            const totalItems = 17;
            const progressPercent = Math.round((completedCount / totalItems) * 100);

            // Check how many are unanswered
            const getMissingCount = () => {
                let missing = 0;
                PART1_QUESTIONS.forEach(q => { if (!part1Answers[q.id]) missing++; });
                PART2_COL_A.forEach(item => { if (!part2Answers[item.id]) missing++; });
                PART3_STATEMENTS.forEach(st => { if (part3Answers[st.id] === undefined) missing++; });
                PART4_QUESTIONS.forEach(q => { if (!part4Answers[q.id]) missing++; });
                return missing;
            };

            // Handle Submit Click
            const handleSubmitClick = () => {
                const missing = getMissingCount();
                if (missing > 0) {
                    setUnansweredCount(missing);
                    setShowConfirmModal(true);
                } else {
                    processGrading();
                }
            };

            // Process Grading Logic
            const processGrading = () => {
                setShowConfirmModal(false);
                let correctCount = 0;

                // Grade Part 1 (4 items, 5 pts each = 20 pts)
                let p1Score = 0;
                const p1Results = {};
                PART1_QUESTIONS.forEach(q => {
                    const userAns = part1Answers[q.id] || "";
                    const isCorrect = userAns.trim().toLowerCase() === q.correct.toLowerCase();
                    p1Results[q.id] = isCorrect;
                    if (isCorrect) {
                        p1Score += 5;
                        correctCount++;
                    }
                });

                // Grade Part 2 (6 items, 5 pts each = 30 pts)
                let p2Score = 0;
                const p2Results = {};
                PART2_COL_A.forEach(item => {
                    const userGroup = part2Answers[item.id];
                    const isCorrect = userGroup === item.group;
                    p2Results[item.id] = isCorrect;
                    if (isCorrect) {
                        p2Score += 5;
                        correctCount++;
                    }
                });

                // Grade Part 3 (4 items, 5 pts each = 20 pts)
                let p3Score = 0;
                const p3Results = {};
                PART3_STATEMENTS.forEach(st => {
                    const userAns = part3Answers[st.id];
                    const isCorrect = userAns === st.correct;
                    p3Results[st.id] = isCorrect;
                    if (isCorrect) {
                        p3Score += 5;
                        correctCount++;
                    }
                });

                // Grade Part 4 (3 items, 10 pts each = 30 pts)
                let p4Score = 0;
                const p4Results = {};
                PART4_QUESTIONS.forEach(q => {
                    const userAns = part4Answers[q.id];
                    const isCorrect = userAns === q.correct;
                    p4Results[q.id] = isCorrect;
                    if (isCorrect) {
                        p4Score += 10;
                        correctCount++;
                    }
                });

                const totalRawScore = p1Score + p2Score + p3Score + p4Score; // 100 max
                const finalScale10 = (totalRawScore / 10).toFixed(1);

                // Classification comment
                let comment = "";
                let numericScore = parseFloat(finalScale10);
                if (numericScore >= 9) {
                    comment = "Xuất sắc!";
                    // Trigger confetti celebration
                    if (window.confetti) {
                        window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    }
                } else if (numericScore >= 7) {
                    comment = "Tốt!";
                } else if (numericScore >= 5) {
                    comment = "Cần luyện thêm!";
                } else {
                    comment = "Xem lại bài nhé!";
                }

                setScoreDetails({
                    totalRawScore,
                    finalScale10,
                    correctCount,
                    comment,
                    p1Score,
                    p2Score,
                    p3Score,
                    p4Score,
                    p1Results,
                    p2Results,
                    p3Results,
                    p4Results
                });
                setIsSubmitted(true);

                // Scroll to top or summary
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // Handle Reset
            const handleReset = () => {
                setPart1Answers({});
                setPart2Answers({});
                setSelectedAItem(null);
                setPart3Answers({});
                setPart4Answers({});
                setIsSubmitted(false);
                setScoreDetails(null);
            };

            // Used keywords list for Part 1 filtering
            const usedKeywords = Object.values(part1Answers);

            return (
                <div className="min-h-screen bg-[#FFFDF5] text-[#103B5C] pb-16">
                    {}
                    <header className="bg-gradient-to-r from-[#103B5C] to-[#1c527d] text-white py-8 px-4 sm:px-8 shadow-xl relative overflow-hidden">
                        <div className="absolute -right-10 -bottom-10 opacity-10 pointer-events-none">
                            <i data-lucide="mountain" className="w-64 h-64"></i>
                        </div>
                        <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 relative z-10">
                            <div className="text-center md:text-left">
                                <div className="inline-flex items-center gap-2 bg-[#FFC83D] text-[#103B5C] px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-3">
                                    <i data-lucide="compass" className="w-4 h-4"></i> Địa lí lớp 8 - Bài 3
                                </div>
                                <h1 className="text-3xl sm:text-5xl font-extrabold tracking-tight text-[#FFC83D] drop-shadow-md">
                                    NHÀ ĐỊA CHẤT TÀI BA
                                </h1>
                                <p className="text-lg sm:text-xl text-amber-100 mt-2 font-medium">
                                    Bài 3. Khoáng sản Việt Nam – Mục 1: Đặc điểm chung của khoáng sản
                                </p>
                            </div>

                            {/* Student Info Inputs */}
                            <div className="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20 w-full md:w-80 flex flex-col gap-3">
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 flex items-center pl-3 text-amber-300">
                                        <i data-lucide="user" className="w-5 h-5"></i>
                                    </span>
                                    <input
                                        type="text"
                                        placeholder="Họ tên học sinh / Nhóm"
                                        value={studentName}
                                        onChange={(e) => setStudentName(e.target.value)}
                                        disabled={isSubmitted}
                                        className="w-full pl-10 pr-4 py-2.5 bg-white/90 text-[#103B5C] font-semibold rounded-xl focus:outline-none focus:ring-2 focus:ring-[#FFC83D] placeholder-gray-400 text-sm shadow-inner"
                                    />
                                </div>
                                <div className="relative">
                                    <span className="absolute inset-y-0 left-0 flex items-center pl-3 text-amber-300">
                                        <i data-lucide="graduation-cap" className="w-5 h-5"></i>
                                    </span>
                                    <input
                                        type="text"
                                        placeholder="Lớp (Ví dụ: 8A1)"
                                        value={studentClass}
                                        onChange={(e) => setStudentClass(e.target.value)}
                                        disabled={isSubmitted}
                                        className="w-full pl-10 pr-4 py-2.5 bg-white/90 text-[#103B5C] font-semibold rounded-xl focus:outline-none focus:ring-2 focus:ring-[#FFC83D] placeholder-gray-400 text-sm shadow-inner"
                                    />
                                </div>
                            </div>
                        </div>

                        {/* Progress Bar */}
                        <div className="max-w-6xl mx-auto mt-6">
                            <div className="flex justify-between items-center text-sm mb-1 font-semibold text-amber-200">
                                <span className="flex items-center gap-1.5"><i data-lucide="list-checks" className="w-4 h-4"></i> Tiến độ hoàn thành</span>
                                <span>{completedCount} / {totalItems} ý ({progressPercent}%)</span>
                            </div>
                            <div className="w-full bg-black/20 h-3 rounded-full overflow-hidden p-0.5 border border-white/10">
                                <div 
                                    className="bg-gradient-to-r from-[#FFC83D] to-amber-300 h-full rounded-full transition-all duration-500"
                                    style={{ width: `${progressPercent}%` }}
                                ></div>
                            </div>
                        </div>
                    </header>

                    {}
                    {isSubmitted && scoreDetails && (
                        <div className="max-w-4xl mx-auto px-4 mt-8">
                            <div className="bg-white rounded-3xl p-6 sm:p-8 border-4 border-[#C2185B] custom-shadow text-center relative overflow-hidden">
                                <div className="absolute top-0 right-0 bg-[#C2185B] text-white px-6 py-2 rounded-bl-2xl font-bold uppercase tracking-wider text-sm">
                                    KẾT QUẢ ĐÁNH GIÁ
                                </div>
                                <div className="inline-flex p-4 bg-pink-50 rounded-full text-[#C2185B] mb-3">
                                    <i data-lucide="trophy" className="w-12 h-12"></i>
                                </div>
                                <h2 className="text-2xl sm:text-3xl font-extrabold text-[#103B5C]">
                                    KẾT QUẢ CỦA NHÀ ĐỊA CHẤT {studentName ? studentName.toUpperCase() : "TÀI BA"}
                                </h2>
                                <p className="text-gray-600 mt-1 font-medium">Lớp: {studentClass || "Chưa cập nhật"}</p>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 my-6">
                                    <div className="bg-amber-50 p-4 rounded-2xl border border-amber-200">
                                        <div className="text-sm text-gray-500 font-semibold">TỔNG ĐIỂM (THANG 10)</div>
                                        <div className="text-4xl font-black text-[#103B5C] mt-1">{scoreDetails.finalScale10}<span className="text-lg text-gray-400">/10</span></div>
                                    </div>
                                    <div className="bg-blue-50 p-4 rounded-2xl border border-blue-200">
                                        <div className="text-sm text-gray-500 font-semibold">SỐ Ý ĐÚNG</div>
                                        <div className="text-4xl font-black text-[#103B5C] mt-1">{scoreDetails.correctCount}<span className="text-lg text-gray-400">/17</span></div>
                                    </div>
                                    <div className="bg-pink-50 p-4 rounded-2xl border border-pink-200">
                                        <div className="text-sm text-gray-500 font-semibold">NHẬN XÉT</div>
                                        <div className="text-2xl font-extrabold text-[#C2185B] mt-2">{scoreDetails.comment}</div>
                                    </div>
                                </div>

                                {/* Detailed Breakdown */}
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm bg-gray-50 p-4 rounded-2xl border">
                                    <div>Phần 1: <strong className="text-[#103B5C]">{scoreDetails.p1Score}/20</strong></div>
                                    <div>Phần 2: <strong className="text-[#103B5C]">{scoreDetails.p2Score}/30</strong></div>
                                    <div>Phần 3: <strong className="text-[#103B5C]">{scoreDetails.p3Score}/20</strong></div>
                                    <div>Phần 4: <strong className="text-[#103B5C]">{scoreDetails.p4Score}/30</strong></div>
                                </div>

                                <div className="mt-6 flex justify-center gap-4">
                                    <button
                                        onClick={handleReset}
                                        className="px-6 py-3 bg-[#103B5C] hover:bg-[#0d2f4a] text-white font-bold rounded-xl shadow-lg transition transform hover:-translate-y-0.5 flex items-center gap-2"
                                    >
                                        <i data-lucide="rotate-ccw" className="w-5 h-5"></i> Làm lại từ đầu
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    <main className="max-w-4xl mx-auto px-4 mt-8 flex flex-col gap-8">
                        
                        {/* --- PART 1: KÉO - THẢ TỪ KHÓA --- */}
                        <section className="bg-white rounded-3xl p-6 sm:p-8 custom-shadow border border-amber-100">
                            <div className="flex items-center justify-between border-b border-gray-100 pb-4 mb-6">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-[#C2185B] text-white flex items-center justify-center font-bold text-lg shadow">
                                        1
                                    </div>
                                    <div>
                                        <h2 className="text-xl font-bold text-[#103B5C]">PHẦN 1. HOÀN THÀNH NHẬN ĐỊNH (20 điểm)</h2>
                                        <p className="text-sm text-gray-500">Kéo hoặc chọn từ khóa điền vào chỗ trống thích hợp (Mỗi câu đúng 5 điểm)</p>
                                    </div>
                                </div>
                                <span className="px-3 py-1 bg-amber-100 text-[#103B5C] font-bold text-xs rounded-full">4 ý</span>
                            </div>

                            {/* Keyword Bank */}
                            <div className="mb-6 p-4 bg-amber-50/70 rounded-2xl border border-amber-200">
                                <div className="text-xs font-bold text-amber-800 uppercase tracking-wide mb-2 flex items-center gap-1.5">
                                    <i data-lucide="key" className="w-4 h-4"></i> Ngân hàng từ khóa (Bấm chọn hoặc kéo thả vào ô trống):
                                </div>
                                <div className="flex flex-wrap gap-2.5">
                                    {PART1_KEYWORDS.map((kw, idx) => {
                                        const isUsed = Object.values(part1Answers).includes(kw);
                                        return (
                                            <div
                                                key={idx}
                                                draggable={!isSubmitted}
                                                onDragStart={(e) => e.dataTransfer.setData("text/plain", kw)}
                                                className={`px-4 py-2 rounded-xl font-bold text-sm transition-all shadow-sm select-none ${
                                                    isUsed 
                                                        ? "bg-gray-200 text-gray-400 border border-gray-300 opacity-60 cursor-not-allowed" 
                                                        : "bg-[#FFC83D] text-[#103B5C] hover:bg-amber-400 hover:shadow cursor-grab active:cursor-grabbing border border-amber-300"
                                                }`}
                                            >
                                                {kw}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Sentences with blanks */}
                            <div className="space-y-4">
                                {PART1_QUESTIONS.map((q, index) => {
                                    const currentVal = part1Answers[q.id] || "";
                                    const isCorrect = scoreDetails ? scoreDetails.p1Results[q.id] : null;

                                    return (
                                        <div 
                                            key={q.id}
                                            className={`p-4 rounded-2xl border transition-all ${
                                                isSubmitted 
                                                    ? (isCorrect ? "bg-green-50/60 border-green-300" : "bg-red-50/60 border-red-300")
                                                    : "bg-gray-50/70 border-gray-200 hover:border-amber-300"
                                            }`}
                                        >
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                                <div className="text-base font-semibold text-[#103B5C]">
                                                    <span className="font-bold mr-2 text-[#C2185B]">{index + 1}.</span>
                                                    {q.text}
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <div
                                                        onDragOver={(e) => e.preventDefault()}
                                                        onDrop={(e) => {
                                                            e.preventDefault();
                                                            if (isSubmitted) return;
                                                            const kw = e.dataTransfer.getData("text/plain");
                                                            if (kw) {
                                                                // Assign keyword, remove from other slot if needed
                                                                const newAns = { ...part1Answers };
                                                                Object.keys(newAns).forEach(k => {
                                                                    if (newAns[k] === kw) delete newAns[k];
                                                                });
                                                                newAns[q.id] = kw;
                                                                setPart1Answers(newAns);
                                                            }
                                                        }}
                                                        className={`min-w-[200px] px-4 py-2 rounded-xl border-2 border-dashed flex items-center justify-between transition-all ${
                                                            currentVal ? "bg-amber-100 border-[#FFC83D] text-[#103B5C] font-bold" : "bg-white border-gray-300 text-gray-400"
                                                        }`}
                                                    >
                                                        <span>{currentVal || "[ Kéo từ khóa vào đây ]"}</span>
                                                        {currentVal && !isSubmitted && (
                                                            <button 
                                                                onClick={() => {
                                                                    const newAns = { ...part1Answers };
                                                                    delete newAns[q.id];
                                                                    setPart1Answers(newAns);
                                                                }}
                                                                className="text-red-500 hover:text-red-700 ml-2 font-bold"
                                                            >
                                                                &times;
                                                            </button>
                                                        )}
                                                    </div>

                                                    {/* Quick select dropdown for devices without drag & drop */}
                                                    {!isSubmitted && (
                                                        <select
                                                            value={currentVal}
                                                            onChange={(e) => {
                                                                const val = e.target.value;
                                                                const newAns = { ...part1Answers };
                                                                if (val) {
                                                                    Object.keys(newAns).forEach(k => {
                                                                        if (newAns[k] === val) delete newAns[k];
                                                                    });
                                                                    newAns[q.id] = val;
                                                                } else {
                                                                    delete newAns[q.id];
                                                                }
                                                                setPart1Answers(newAns);
                                                            }}
                                                            className="text-xs py-2 px-2 bg-white border border-gray-300 rounded-lg text-[#103B5C] focus:outline-none"
                                                            title="Chọn từ khóa"
                                                        >
                                                            <option value="">Chọn...</option>
                                                            {PART1_KEYWORDS.map((kw, i) => (
                                                                <option key={i} value={kw}>{kw}</option>
                                                            ))}
                                                        </select>
                                                    )}
                                                </div>
                                            </div>

                                            {isSubmitted && !isCorrect && (
                                                <div className="mt-2 text-xs text-red-600 font-semibold flex items-center gap-1">
                                                    <i data-lucide="x-circle" className="w-4 h-4"></i> Đáp án đúng: <span className="underline">{q.correct}</span>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </section>


                        {/* --- PART 2: NỐI KHOÁNG SẢN VỚI NHÓM TƯƠNG TỨNG --- */}
                        <section className="bg-white rounded-3xl p-6 sm:p-8 custom-shadow border border-amber-100">
                            <div className="flex items-center justify-between border-b border-gray-100 pb-4 mb-6">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-[#C2185B] text-white flex items-center justify-center font-bold text-lg shadow">
                                        2
                                    </div>
                                    <div>
                                        <h2 className="text-xl font-bold text-[#103B5C]">PHẦN 2. NỐI KHOÁNG SẢN VỚI NHÓM (30 điểm)</h2>
                                        <p className="text-sm text-gray-500">Bấm chọn một khoáng sản ở Cột A, sau đó bấm chọn nhóm ở Cột B (Mỗi cặp đúng 5 điểm)</p>
                                    </div>
                                </div>
                                <span className="px-3 py-1 bg-amber-100 text-[#103B5C] font-bold text-xs rounded-full">6 ý</span>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 relative">
                                {/* Column A: Minerals */}
                                <div className="space-y-3">
                                    <div className="text-sm font-bold text-[#103B5C] uppercase tracking-wider mb-2 flex items-center gap-1">
                                        <i data-lucide="layers" className="w-4 h-4 text-[#C2185B]"></i> Cột A: Khoáng sản
                                    </div>
                                    {PART2_COL_A.map((item) => {
                                        const isSelected = selectedAItem === item.id;
                                        const assignedGroup = part2Answers[item.id];
                                        const isCorrect = scoreDetails ? scoreDetails.p2Results[item.id] : null;

                                        return (
                                            <div
                                                key={item.id}
                                                onClick={() => {
                                                    if (isSubmitted) return;
                                                    setSelectedAItem(item.id);
                                                }}
                                                className={`p-4 rounded-2xl border-2 transition-all flex items-center justify-between cursor-pointer ${
                                                    isSubmitted
                                                        ? (isCorrect ? "bg-green-50 border-green-300" : "bg-red-50 border-red-300")
                                                        : (isSelected ? "bg-amber-100 border-[#FFC83D] shadow-md" : "bg-white border-gray-200 hover:border-amber-300")
                                                }`}
                                            >
                                                <div className="flex items-center gap-3">
                                                    <span className="w-7 h-7 rounded-full bg-[#103B5C] text-white font-bold text-xs flex items-center justify-center">
                                                        {item.id}
                                                    </span>
                                                    <span className="font-bold text-[#103B5C]">{item.name}</span>
                                                </div>
                                                <div className="text-xs font-semibold px-3 py-1.5 rounded-lg bg-gray-100 text-gray-600">
                                                    {assignedGroup ? `Nhóm ${assignedGroup}` : (isSelected ? "Đang chọn..." : "Bấm để nối")}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Column B: Groups */}
                                <div className="space-y-3">
                                    <div className="text-sm font-bold text-[#103B5C] uppercase tracking-wider mb-2 flex items-center gap-1">
                                        <i data-lucide="folder-kanban" className="w-4 h-4 text-[#C2185B]"></i> Cột B: Nhóm khoáng sản
                                    </div>
                                    {PART2_COL_B.map((grp) => {
                                        return (
                                            <div
                                                key={grp.id}
                                                onClick={() => {
                                                    if (isSubmitted || !selectedAItem) return;
                                                    // Assign selectedAItem to this group
                                                    const newAnswers = { ...part2Answers, [selectedAItem]: grp.id };
                                                    setPart2Answers(newAnswers);
                                                    setSelectedAItem(null);
                                                }}
                                                className={`p-4 rounded-2xl border-2 transition-all flex items-center justify-between ${
                                                    selectedAItem && !isSubmitted
                                                        ? "bg-amber-50 border-amber-300 cursor-pointer hover:bg-amber-100"
                                                        : "bg-white border-gray-200"
                                                }`}
                                            >
                                                <span className="font-bold text-[#103B5C]">{grp.label}</span>
                                                <span className="text-xs bg-blue-50 text-[#103B5C] px-2 py-1 rounded-md font-semibold">
                                                    {Object.keys(part2Answers).filter(k => part2Answers[k] === grp.id).length} khoáng sản
                                                </span>
                                            </div>
                                        );
                                    })}

                                    {selectedAItem && !isSubmitted && (
                                        <div className="p-3 bg-amber-100 text-[#103B5C] rounded-xl text-center text-sm font-semibold animate-pulse">
                                            Đang chọn khoáng sản <span className="underline font-bold">{PART2_COL_A.find(x => x.id === selectedAItem)?.name}</span>. Vui lòng bấm vào Nhóm ở Cột B để nối!
                                        </div>
                                    )}

                                    {isSubmitted && (
                                        <div className="p-4 bg-gray-50 rounded-2xl border text-xs text-gray-600">
                                            <div className="font-bold mb-1 text-[#103B5C]">Đáp án chuẩn:</div>
                                            <div>1-A, 2-A, 3-B, 4-B, 5-C, 6-C</div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </section>


                        {/* --- PART 3: ĐÚNG / SAI --- */}
                        <section className="bg-white rounded-3xl p-6 sm:p-8 custom-shadow border border-amber-100">
                            <div className="flex items-center justify-between border-b border-gray-100 pb-4 mb-6">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-[#C2185B] text-white flex items-center justify-center font-bold text-lg shadow">
                                        3
                                    </div>
                                    <div>
                                        <h2 className="text-xl font-bold text-[#103B5C]">PHẦN 3. ĐÚNG / SAI (20 điểm)</h2>
                                        <p className="text-sm text-gray-500">Xác định mỗi nhận định sau là Đúng hay Sai (Mỗi câu đúng 5 điểm)</p>
                                    </div>
                                </div>
                                <span className="px-3 py-1 bg-amber-100 text-[#103B5C] font-bold text-xs rounded-full">4 ý</span>
                            </div>

                            <div className="space-y-4">
                                {PART3_STATEMENTS.map((st, index) => {
                                    const userAns = part3Answers[st.id];
                                    const isCorrect = scoreDetails ? scoreDetails.p3Results[st.id] : null;

                                    return (
                                        <div
                                            key={st.id}
                                            className={`p-5 rounded-2xl border transition-all ${
                                                isSubmitted
                                                    ? (isCorrect ? "bg-green-50/60 border-green-300" : "bg-red-50/60 border-red-300")
                                                    : "bg-gray-50/70 border-gray-200"
                                            }`}
                                        >
                                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                                <div className="text-base font-semibold text-[#103B5C] flex-1">
                                                    <span className="font-bold mr-2 text-[#C2185B]">{index + 1}.</span>
                                                    {st.text}
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button
                                                        disabled={isSubmitted}
                                                        onClick={() => setPart3Answers({ ...part3Answers, [st.id]: true })}
                                                        className={`px-6 py-2.5 rounded-xl font-bold text-sm transition shadow-sm ${
                                                            userAns === true
                                                                ? "bg-green-600 text-white shadow"
                                                                : "bg-white text-green-700 border border-green-300 hover:bg-green-50"
                                                        }`}
                                                    >
                                                        ĐÚNG
                                                    </button>
                                                    <button
                                                        disabled={isSubmitted}
                                                        onClick={() => setPart3Answers({ ...part3Answers, [st.id]: false })}
                                                        className={`px-6 py-2.5 rounded-xl font-bold text-sm transition shadow-sm ${
                                                            userAns === false
                                                                ? "bg-red-600 text-white shadow"
                                                                : "bg-white text-red-700 border border-red-300 hover:bg-red-50"
                                                        }`}
                                                    >
                                                        SAI
                                                    </button>
                                                </div>
                                            </div>

                                            {isSubmitted && !isCorrect && (
                                                <div className="mt-3 text-xs text-red-600 font-semibold flex items-center gap-1 bg-white/80 p-2.5 rounded-xl border border-red-200">
                                                    <i data-lucide="alert-circle" className="w-4 h-4 text-red-500 shrink-0"></i>
                                                    <span>{st.explanation}</span>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </section>


                        {/* --- PART 4: TRẮC NGHIỆM - ĐẤU TRƯỜNG TRI THỨC --- */}
                        <section className="bg-white rounded-3xl p-6 sm:p-8 custom-shadow border border-amber-100">
                            <div className="flex items-center justify-between border-b border-gray-100 pb-4 mb-6">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-[#C2185B] text-white flex items-center justify-center font-bold text-lg shadow">
                                        4
                                    </div>
                                    <div>
                                        <h2 className="text-xl font-bold text-[#103B5C]">PHẦN 4. TRẮC NGHIỆM – ĐẤU TRƯỜNG TRI THỨC (30 điểm)</h2>
                                        <p className="text-sm text-gray-500">Chọn phương án đúng nhất (Mỗi câu đúng 10 điểm)</p>
                                    </div>
                                </div>
                                <span className="px-3 py-1 bg-amber-100 text-[#103B5C] font-bold text-xs rounded-full">3 câu</span>
                            </div>

                            <div className="space-y-6">
                                {PART4_QUESTIONS.map((q) => {
                                    const userChoice = part4Answers[q.id];
                                    const isCorrect = scoreDetails ? scoreDetails.p4Results[q.id] : null;

                                    return (
                                        <div
                                            key={q.id}
                                            className={`p-5 rounded-2xl border transition-all ${
                                                isSubmitted
                                                    ? (isCorrect ? "bg-green-50/60 border-green-300" : "bg-red-50/60 border-red-300")
                                                    : "bg-gray-50/70 border-gray-200"
                                            }`}
                                        >
                                            <div className="text-base font-bold text-[#103B5C] mb-4">
                                                {q.question}
                                            </div>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                {q.options.map((opt) => {
                                                    const isSelected = userChoice === opt.key;
                                                    const isOptCorrect = opt.key === q.correct;

                                                    let btnStyle = "bg-white border-gray-200 text-[#103B5C] hover:border-amber-300";
                                                    if (isSelected && !isSubmitted) {
                                                        btnStyle = "bg-[#FFC83D] border-[#FFC83D] text-[#103B5C] font-extrabold shadow-sm";
                                                    }
                                                    if (isSubmitted) {
                                                        if (isOptCorrect) {
                                                            btnStyle = "bg-green-100 border-green-500 text-green-900 font-bold";
                                                        } else if (isSelected && !isOptCorrect) {
                                                            btnStyle = "bg-red-100 border-red-500 text-red-900 font-bold";
                                                        }
                                                    }

                                                    return (
                                                        <button
                                                            key={opt.key}
                                                            disabled={isSubmitted}
                                                            onClick={() => setPart4Answers({ ...part4Answers, [q.id]: opt.key })}
                                                            className={`p-3.5 rounded-xl border-2 text-left font-medium text-sm transition flex items-center gap-3 ${btnStyle}`}
                                                        >
                                                            <span className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shrink-0 ${
                                                                isSelected ? "bg-[#103B5C] text-white" : "bg-gray-100 text-gray-700"
                                                            }`}>
                                                                {opt.key}
                                                            </span>
                                                            <span>{opt.text}</span>
                                                        </button>
                                                    );
                                                })}
                                            </div>

                                            {isSubmitted && !isCorrect && (
                                                <div className="mt-3 text-xs text-red-600 font-semibold flex items-center gap-1 bg-white/80 p-2.5 rounded-xl border border-red-200">
                                                    <i data-lucide="info" className="w-4 h-4 text-red-500 shrink-0"></i>
                                                    <span>Giải thích: {q.explanation}</span>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </section>


                        {/* --- ACTION BUTTONS --- */}
                        <div className="flex flex-col sm:flex-row justify-center items-center gap-4 py-6">
                            <button
                                onClick={handleSubmitClick}
                                className="w-full sm:w-auto px-10 py-4 bg-[#C2185B] hover:bg-[#a0134a] text-white font-extrabold text-lg rounded-2xl shadow-xl transition transform hover:-translate-y-1 flex items-center justify-center gap-3 glow-effect"
                            >
                                <i data-lucide="award" className="w-6 h-6"></i> CHẤM ĐIỂM
                            </button>
                            <button
                                onClick={handleReset}
                                className="w-full sm:w-auto px-8 py-4 bg-[#103B5C] hover:bg-[#0d2f4a] text-white font-bold text-lg rounded-2xl shadow-lg transition transform hover:-translate-y-0.5 flex items-center justify-center gap-3"
                            >
                                <i data-lucide="rotate-ccw" className="w-5 h-5"></i> LÀM LẠI
                            </button>
                        </div>
                    </main>

                    {/* --- CONFIRMATION MODAL FOR UNANSWERED QUESTIONS --- */}
                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full custom-shadow border-2 border-amber-200 text-center animate-bounce-short">
                                <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <i data-lucide="alert-triangle" className="w-8 h-8"></i>
                                </div>
                                <h3 className="text-xl font-extrabold text-[#103B5C] mb-2">Vẫn còn ý chưa trả lời!</h3>
                                <p className="text-gray-600 text-sm mb-6">
                                    Bạn còn <strong className="text-[#C2185B]">{unansweredCount}</strong> ý chưa hoàn thành. Các ý chưa trả lời sẽ được tính 0 điểm. Bạn có chắc chắn muốn nộp bài không?
                                </p>
                                <div className="flex gap-3 justify-center">
                                    <button
                                        onClick={() => setShowConfirmModal(false)}
                                        className="px-5 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-xl transition"
                                    >
                                        Quay lại làm tiếp
                                    </button>
                                    <button
                                        onClick={processGrading}
                                        className="px-6 py-2.5 bg-[#C2185B] hover:bg-[#a0134a] text-white font-bold rounded-xl shadow-md transition"
                                    >
                                        Vẫn nộp bài
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="text-center text-xs text-gray-500 mt-12 py-6 border-t border-gray-200">
                        Phiếu học tập tương tác Địa lí 8 – Bài 3: Khoáng sản Việt Nam. Thiết kế dành riêng cho nhà địa chất tài ba!
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
